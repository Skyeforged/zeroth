<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endfield Essence Tools</title>
    <style>
      /* Pre-mount loading screen: shown until Vue replaces the contents of #app. */
      html { background: #fff; color-scheme: light dark; }
      body { margin: 0; }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #52525b;
        background: #fff;
      }
      .boot-sub { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #10b981; }
      .boot-title { font-size: 1.25rem; font-weight: 700; margin-top: -0.75rem; }
      .boot-spinner {
        width: 2rem;
        height: 2rem;
        border: 3px solid rgba(16, 185, 129, 0.25);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, .boot { background: #09090b; color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-spinner"></div>
        <div class="boot-sub">Endfield</div>
        <div class="boot-title">Essence Tools</div>
        <div>Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
